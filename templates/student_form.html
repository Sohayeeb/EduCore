{% extends 'base.html' %}

{% block title %}— {{ action }} Student{% endblock %}

{% block content %}
<div class="form-card">
    <div class="form-card-header">
        <h2>{{ action }} Student</h2>
    </div>
    <div class="form-card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-input"
                        placeholder="Enter full name"
                        value="{{ student.name|default:'' }}"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter email"
                        value="{{ student.email|default:'' }}"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input
                        type="text"
                        name="phone"
                        class="form-input"
                        placeholder="Enter phone number"
                        value="{{ student.phone|default:'' }}"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label">GPA</label>
                    <input
                        type="number"
                        name="gpa"
                        class="form-input"
                        placeholder="0.00 - 4.00"
                        step="0.01"
                        min="0"
                        max="4"
                        value="{{ student.gpa|default:'' }}"
                    >
                </div>
                <div class="form-group">
                    <label class="form-label">Course</label>
                    <select name="course" class="form-input" required>
                        {% for val, label in courses %}
                            <option value="{{ val }}" {% if student.course == val %}selected{% endif %}>
                                {{ label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-input">
                        {% for val, label in statuses %}
                            <option value="{{ val }}" {% if student.status == val %}selected{% endif %}>
                                {{ label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group full">
                    <label class="form-label">Address</label>
                    <textarea
                        name="address"
                        class="form-input"
                        placeholder="Enter address"
                        rows="3"
                    >{{ student.address|default:'' }}</textarea>
                </div>
                <div class="form-group full">
                    <label class="form-label">Profile Picture</label>
                    <input
                        type="file"
                        name="profile_picture"
                        class="form-input"
                        accept="image/*"
                    >
                </div>
            </div>
            <div class="form-actions">
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">{{ action }} Student</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
