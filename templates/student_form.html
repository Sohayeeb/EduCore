{% extends 'base.html' %}
{% block title %}— {{ action }} Student{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card" style="max-width:600px;">
        <h2 class="auth-title">{{ action }} Student</h2>
        <form method="POST" enctype="multipart/form-data" class="auth-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="form-error">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary btn-block">{{ action }} Student</button>
        </form>
        <p class="auth-footer"><a href="{% url 'dashboard' %}">← Back</a></p>
    </div>
</div>
{% endblock %}
